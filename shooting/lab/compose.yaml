# 장애 대응 게임용 로컬 MySQL 랩.
#
# 두 서버는 복제가 "구성되지 않은" 상태로 뜬다 — binlog/GTID만 켜두고
# CHANGE REPLICATION SOURCE는 하지 않는다. 복제 구성 자체가 구축 스테이지의
# 과제이고, 장애 스테이지는 setup 단계에서 엔진이 알아서 배선하기 때문이다.
#
#   ./shoot up     기동
#   ./shoot down   정리(볼륨 포함)
name: dbshoot

services:
  primary:
    image: mysql:8.4
    container_name: dbshoot-primary
    command: --mysql-native-password=OFF
    environment:
      MYSQL_ROOT_PASSWORD: dbshoot-root
      MYSQL_ROOT_HOST: "%"
    ports:
      # 루프백에만 노출한다. 랩의 root/dba/app 비밀번호는 고정 문자열이고
      # MYSQL_ROOT_HOST가 '%'라, 0.0.0.0에 열면 같은 네트워크의 다른 장비가
      # root로 붙을 수 있다(공용 와이파이에서 특히). 복제는 컨테이너 네트워크의
      # primary:3306으로 붙으므로 이 제한에 영향받지 않는다.
      - "127.0.0.1:3306:3306"
    tmpfs:
      # 디스크 풀 스테이지(3-3) 전용의 아주 작은 파일시스템.
      #
      # 주 데이터 볼륨을 채우는 방식은 쓰지 않는다 — 시스템 테이블스페이스가 차면
      # InnoDB가 손상돼 `./shoot down -v` 말고는 되돌릴 방법이 없어질 수 있다.
      # 여기에 테이블 파일 하나만 올려두면 그 테이블 쓰기만 실패하고 나머지
      # 데이터베이스는 멀쩡하다. tmpfs라 컨테이너를 다시 띄우면 저절로 비워진다.
      - /var/lib/dbshoot-audit:size=32m,mode=1777
    volumes:
      - primary-data:/var/lib/mysql
      - ./conf/primary.cnf:/etc/mysql/conf.d/zz-dbshoot.cnf:ro
      - ./conf/root-client.cnf:/root/.my.cnf:ro
      - ./seed:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # 자격증명은 /root/.my.cnf에서 읽는다 — 명령줄에 비밀번호를 노출하지 않는다.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

  replica:
    image: mysql:8.4
    container_name: dbshoot-replica
    command: --mysql-native-password=OFF
    environment:
      MYSQL_ROOT_PASSWORD: dbshoot-root
      MYSQL_ROOT_HOST: "%"
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - replica-data:/var/lib/mysql
      - ./conf/replica.cnf:/etc/mysql/conf.d/zz-dbshoot.cnf:ro
      - ./conf/root-client.cnf:/root/.my.cnf:ro
      - ./seed:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

volumes:
  primary-data:
  replica-data:
